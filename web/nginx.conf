server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static course assets; no caching while iterating.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # Prometheus API proxy — the UI queries this same-origin, so no CORS
    # trouble and no need for the browser to reach :9090 directly.
    location /prom/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
    }

    # Grafana health probe for the status pill (no subpath issues).
    location = /grafana-health {
        proxy_pass http://grafana:3000/api/health;
        proxy_set_header Host $host;
    }
}
